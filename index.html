<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พจนานุกรมค้นหาคำภาษาไทย</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4">
    <div class="max-w-xl mx-auto p-5 bg-white min-h-screen sm:min-h-fit sm:my-8 sm:rounded-2xl sm:shadow-sm border border-slate-100">
        <!-- Header -->
        <header class="flex items-center gap-3 mb-6">
            <div class="h-12 w-12 bg-amber-500 rounded-xl flex items-center justify-center text-white font-bold text-2xl shadow-sm shrink-0">
                พ
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-900">พจนานุกรมค้นหาคำภาษาไทย</h1>
                <p class="text-xs sm:text-sm text-slate-500">ค้นหาคำศัพท์จากตัวอักษร (Thai Dictionary Word Finder)</p>
            </div>
        </header>

        <!-- Status Bar -->
        <div id="statusBar" class="mb-5 p-3 bg-amber-50 border border-amber-200/60 rounded-xl flex items-center justify-between text-xs sm:text-sm text-amber-800">
            <span id="statusText">กำลังเชื่อมต่อฐานข้อมูลพจนานุกรม...</span>
            <span class="bg-amber-200/70 px-2.5 py-0.5 rounded-full font-semibold"><span id="wordCountBadge">0</span> คำ</span>
        </div>

        <!-- Search Box -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">
                ระบุตัวอักษรที่อยู่ในคำศัพท์ (เช่น ร ฟ, ก ล า, สม)
            </label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="searchInput" maxlength="50" disabled placeholder="รอโหลดฐานข้อมูลสักครู่..." class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all disabled:opacity-50">
                <button id="clearBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        </div>

        <!-- Quick Suggestions -->
        <div class="mb-5">
            <p class="text-xs text-slate-500 mb-2">ตัวอย่างการค้นหา:</p>
            <div class="flex flex-wrap gap-2">
                <button onclick="setQuery('ร ฟ')" class="px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200/80 rounded-full text-xs font-medium transition-colors">ร ฟ (รถไฟ, รางรถไฟ)</button>
                <button onclick="setQuery('ก ล า')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full text-xs font-medium transition-colors">ก ล า</button>
                <button onclick="setQuery('ประ')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full text-xs font-medium transition-colors">ประ</button>
                <button onclick="setQuery('ทร')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full text-xs font-medium transition-colors">ทร</button>
            </div>
        </div>

        <!-- Mode Selection -->
        <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-xl mb-4">
            <button id="modeSeqBtn" onclick="setMode('seq')" class="py-2 text-xs sm:text-sm font-semibold rounded-lg bg-white text-slate-900 shadow-sm transition-all">
                เรียงตามลำดับตัวอักษร
            </button>
            <button id="modeAnyBtn" onclick="setMode('any')" class="py-2 text-xs sm:text-sm font-medium rounded-lg text-slate-500 hover:text-slate-800 transition-all">
                มีครบทุกตัว (สลับที่ได้)
            </button>
        </div>

        <!-- Length Filter (สูงสุด 15 ตัวอักษร) -->
        <div class="mb-4">
            <p class="text-xs text-slate-500 mb-2">ความยาวตัวอักษร (สูงสุด 15 ตัว):</p>
            <div class="flex flex-wrap gap-1.5" id="lengthFilterContainer">
                <button onclick="setLength('all')" data-len="all" class="len-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-white transition-all">ทั้งหมด</button>
                <button onclick="setLength('2-3')" data-len="2-3" class="len-btn px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">2-3 ตัว</button>
                <button onclick="setLength('4-5')" data-len="4-5" class="len-btn px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">4-5 ตัว</button>
                <button onclick="setLength('6-8')" data-len="6-8" class="len-btn px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">6-8 ตัว</button>
                <button onclick="setLength('9-12')" data-len="9-12" class="len-btn px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">9-12 ตัว</button>
                <button onclick="setLength('13-15')" data-len="13-15" class="len-btn px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">13-15 ตัว</button>
            </div>
        </div>

        <!-- Sort Order (เพิ่มฟังก์ชันเลือกดูคำสั้นสุด / ยาวสุดก่อน) -->
        <div class="mb-6">
            <p class="text-xs text-slate-500 mb-2">การแสดงผลผลลัพธ์:</p>
            <div class="grid grid-cols-2 gap-2">
                <button id="sortShortBtn" onclick="setSort('short')" class="py-2 px-3 text-xs font-semibold rounded-xl bg-amber-50 text-amber-800 border border-amber-200/80 transition-all">
                    ⚡ คำสั้นสุดขึ้นก่อน
                </button>
                <button id="sortLongBtn" onclick="setSort('long')" class="py-2 px-3 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">
                    📏 คำยาวสุดขึ้นก่อน
                </button>
            </div>
        </div>

        <!-- Results Header -->
        <div class="flex justify-between items-center pb-2 border-b border-slate-100 mb-4">
            <span class="text-xs font-semibold text-slate-600">ผลลัพธ์การค้นหา</span>
            <span id="resultCount" class="text-xs text-slate-400">รอโหลดฐานข้อมูล</span>
        </div>

        <!-- Results List -->
        <div id="resultsList" class="space-y-3">
            <div class="text-center py-12 text-slate-400 text-sm">
                กำลังดาวน์โหลดคลังคำศัพท์ภาษาไทย...
            </div>
        </div>
    </div>

    <script>
        let dictionary = [];
        let currentMode = 'seq';
        let currentLength = 'all';
        let currentSort = 'short'; // ค่าเริ่มต้น: คำสั้นสุดขึ้นก่อน

        const searchInput = document.getElementById('searchInput');
        const resultsList = document.getElementById('resultsList');
        const resultCount = document.getElementById('resultCount');
        const clearBtn = document.getElementById('clearBtn');
        const statusText = document.getElementById('statusText');
        const wordCountBadge = document.getElementById('wordCountBadge');

        async function loadDictionary() {
            const dictSources = [
                'https://raw.githubusercontent.com/PyThaiNLP/pythainlp/dev/pythainlp/corpus/words_th.txt',
                'https://raw.githubusercontent.com/wongnai/thai-dictionary/master/words.txt'
            ];

            for (const url of dictSources) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) continue;
                    const text = await response.text();
                    
                    const words = text.split(/\r?\n/)
                        .map(w => w.trim())
                        .filter(w => /^[ก-๛]+$/.test(w) && w.length >= 2 && w.length <= 15);
                    
                    if (words.length > 1000) {
                        dictionary = [...new Set(words)];
                        wordCountBadge.innerText = dictionary.length.toLocaleString();
                        statusText.innerText = 'พร้อมใช้งานฐานข้อมูลพจนานุกรมขนาดใหญ่';
                        searchInput.disabled = false;
                        searchInput.placeholder = 'พิมพ์ตัวอักษร 2-3 ตัวขึ้นไป (เว้นวรรคได้)';
                        resultCount.innerText = 'พิมพ์ค้นหาเพื่อเริ่มใช้งาน';
                        resultsList.innerHTML = '<div class="text-center py-12 text-slate-400 text-sm">กรอกตัวอักษรในช่องด้านบนเพื่อค้นหาคำในพจนานุกรม</div>';
                        return;
                    }
                } catch (e) {
                    console.warn('เปลี่ยนแหล่งข้อมูลสำรอง...', e);
                }
            }

            statusText.innerText = 'ไม่สามารถเชื่อมต่อฐานข้อมูลออนไลน์ได้ กรุณาลองรีเฟรชหน้าเว็บ';
        }

        loadDictionary();

        searchInput.addEventListener('input', () => {
            clearBtn.classList.toggle('hidden', searchInput.value.length === 0);
            handleSearch();
        });

        function setQuery(q) {
            if (searchInput.disabled) return;
            searchInput.value = q;
            clearBtn.classList.remove('hidden');
            handleSearch();
        }

        function clearSearch() {
            searchInput.value = '';
            clearBtn.classList.add('hidden');
            handleSearch();
        }

        function setMode(mode) {
            currentMode = mode;
            const seqBtn = document.getElementById('modeSeqBtn');
            const anyBtn = document.getElementById('modeAnyBtn');
            
            if (mode === 'seq') {
                seqBtn.className = "py-2 text-xs sm:text-sm font-semibold rounded-lg bg-white text-slate-900 shadow-sm transition-all";
                anyBtn.className = "py-2 text-xs sm:text-sm font-medium rounded-lg text-slate-500 hover:text-slate-800 transition-all";
            } else {
                anyBtn.className = "py-2 text-xs sm:text-sm font-semibold rounded-lg bg-white text-slate-900 shadow-sm transition-all";
                seqBtn.className = "py-2 text-xs sm:text-sm font-medium rounded-lg text-slate-500 hover:text-slate-800 transition-all";
            }
            handleSearch();
        }

        function setLength(len) {
            currentLength = len;
            document.querySelectorAll('.len-btn').forEach(btn => {
                if (btn.getAttribute('data-len') === len) {
                    btn.className = "len-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-white transition-all";
                } else {
                    btn.className = "len-btn px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all";
                }
            });
            handleSearch();
        }

        function setSort(sortType) {
            currentSort = sortType;
            const sortShortBtn = document.getElementById('sortShortBtn');
            const sortLongBtn = document.getElementById('sortLongBtn');

            if (sortType === 'short') {
                sortShortBtn.className = "py-2 px-3 text-xs font-semibold rounded-xl bg-amber-50 text-amber-800 border border-amber-200/80 transition-all";
                sortLongBtn.className = "py-2 px-3 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all";
            } else {
                sortLongBtn.className = "py-2 px-3 text-xs font-semibold rounded-xl bg-amber-50 text-amber-800 border border-amber-200/80 transition-all";
                sortShortBtn.className = "py-2 px-3 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all";
            }
            handleSearch();
        }

        function handleSearch() {
            const rawQuery = searchInput.value.trim();
            if (!rawQuery) {
                resultsList.innerHTML = '<div class="text-center py-12 text-slate-400 text-sm">กรอกตัวอักษรในช่องด้านบนเพื่อค้นหาคำในพจนานุกรม</div>';
                resultCount.innerText = 'พิมพ์ค้นหาเพื่อเริ่มใช้งาน';
                return;
            }

            const queryChars = rawQuery.replace(/\s+/g, '').split('');

            let filtered = dictionary.filter(word => {
                const len = word.length;
                if (currentLength === '2-3' && (len < 2 || len > 3)) return false;
                if (currentLength === '4-5' && (len < 4 || len > 5)) return false;
                if (currentLength === '6-8' && (len < 6 || len > 8)) return false;
                if (currentLength === '9-12' && (len < 9 || len > 12)) return false;
                if (currentLength === '13-15' && (len < 13 || len > 15)) return false;

                if (currentMode === 'seq') {
                    let lastIndex = -1;
                    for (let char of queryChars) {
                        const idx = word.indexOf(char, lastIndex + 1);
                        if (idx === -1) return false;
                        lastIndex = idx;
                    }
                    return true;
                } else {
                    let tempWord = word;
                    for (let char of queryChars) {
                        const idx = tempWord.indexOf(char);
                        if (idx === -1) return false;
                        tempWord = tempWord.slice(0, idx) + tempWord.slice(idx + 1);
                    }
                    return true;
                }
            });

            // จัดเรียงลำดับตามที่ผู้ใช้เลือก (คำสั้นสุดก่อน หรือคำยาวสุดก่อน)
            filtered.sort((a, b) => {
                if (currentSort === 'short') {
                    return a.length - b.length || a.localeCompare(b, 'th');
                } else {
                    return b.length - a.length || a.localeCompare(b, 'th');
                }
            });

            displayResults(filtered);
        }

        function displayResults(items) {
            const total = items.length;
            const limit = 100;
            const shownItems = items.slice(0, limit);

            if (total > limit) {
                resultCount.innerText = `พบ ${total.toLocaleString()} คำ (แสดง ${limit} คำแรก)`;
            } else {
                resultCount.innerText = `พบทั้งหมด ${total.toLocaleString()} คำ`;
            }
            
            if (total === 0) {
                resultsList.innerHTML = '<div class="text-center py-12 text-slate-400 text-sm">ไม่พบคำที่ตรงกับเงื่อนไขการค้นหา</div>';
                return;
            }

            resultsList.innerHTML = shownItems.map(word => `
                <div class="p-3.5 bg-white border border-slate-100 rounded-xl shadow-sm hover:border-amber-400/50 flex justify-between items-center transition-all">
                    <span class="font-bold text-slate-900 text-base sm:text-lg">${word}</span>
                    <span class="text-xs px-2.5 py-1 bg-slate-100 text-slate-600 rounded-full font-medium">${word.length} ตัวอักษร</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
